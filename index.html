<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1230">
<title>MG y los Fundadores</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1230; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; font-family: Playtime, 'Trebuchet MS', sans-serif; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffe680; gap: 14px; font-size: 20px; background: #0e1230; z-index: 5; }
  #loading .bar { width: 240px; height: 10px; border: 2px solid #ffe680; border-radius: 6px; overflow: hidden; }
  #loadbar { height: 100%; width: 0; background: #ffe680; transition: width .2s; }
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  #touch .btn, #dpad { pointer-events: auto; position: absolute; }
  #dpad { left: calc(16px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 132px; height: 132px; }
  #dpad .k svg { pointer-events: none; display: block; }
  #dpad .k { position: absolute; width: 44px; height: 44px; background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.45); border-radius: 9px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  #dpad .k.on { background: rgba(255,230,128,0.55); }
  #dpad [data-b=up] { left: 44px; top: 0; } #dpad [data-b=down] { left: 44px; bottom: 0; } #dpad [data-b=left] { left: 0; top: 44px; } #dpad [data-b=right] { right: 0; top: 44px; }
  .btn { width: 62px; height: 62px; border-radius: 50%; background: rgba(232,76,90,0.55); border: 2px solid rgba(255,255,255,0.6); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .btn.on { background: rgba(255,230,128,0.7); }
  #bA { right: calc(18px + env(safe-area-inset-right)); bottom: calc(52px + env(safe-area-inset-bottom)); }
  #bB { right: calc(88px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); background: rgba(80,110,200,0.55); }
  #bS { right: calc(18px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); width: auto; height: 34px; padding: 0 14px; border-radius: 17px; font-size: 14px; background: rgba(28,36,80,0.7); }
</style>
</head>
<body>
<div id="loading"><div>Abriendo el libro…</div><div class="bar"><div id="loadbar"></div></div></div>
<canvas id="game" width="384" height="256"></canvas>
<div id="touch">
  <div id="dpad"><div class="k" data-b="up"><svg viewBox="0 0 20 20" width="18" height="18" style="transform:rotate(0deg)"><path d="M10 3 L18 16 L2 16 Z" fill="#fff"/></svg></div><div class="k" data-b="left"><svg viewBox="0 0 20 20" width="18" height="18" style="transform:rotate(-90deg)"><path d="M10 3 L18 16 L2 16 Z" fill="#fff"/></svg></div><div class="k" data-b="right"><svg viewBox="0 0 20 20" width="18" height="18" style="transform:rotate(90deg)"><path d="M10 3 L18 16 L2 16 Z" fill="#fff"/></svg></div><div class="k" data-b="down"><svg viewBox="0 0 20 20" width="18" height="18" style="transform:rotate(180deg)"><path d="M10 3 L18 16 L2 16 Z" fill="#fff"/></svg></div></div>
  <div class="btn" id="bA" data-b="a">A</div>
  <div class="btn" id="bB" data-b="b">B</div>
  <div class="btn" id="bS" data-b="start">LIBRO</div>
</div>
<script src="js/fuente.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ds.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/three_gltf.js"></script>
<script src="js/m3d_manifest.js"></script>
<script src="js/mundo3d.js"></script>
<script src="js/m3d_modelos.js"></script>
<script src="js/modelos3d.js"></script>
<script src="js/animales3d.js"></script>
<script src="js/ui.js"></script>
<script src="js/accion.js"></script>
<script src="js/maps.js"></script>
<script src="js/barrios.js"></script>
<script src="js/story.js"></script>
<script src="js/pistas.js"></script>
<script>boot();</script>
</body>
</html>
